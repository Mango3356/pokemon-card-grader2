<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GradScan · anteprima iPhone</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#0B0F14;--fg:#F5F7FA;--muted:#9AA4B2;--line:rgba(255,255,255,.12);--accent:#63E6BE;--on-accent:#05261C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Manrope,-apple-system,system-ui,sans-serif}
.page{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.side{max-width:340px;display:flex;flex-direction:column;gap:14px}
.side h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em}
.side h1 span{color:var(--accent)}
.side p{margin:0;color:var(--muted);line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--fg);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:99px;align-self:flex-start}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:8px 14px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--fg)}
.stage{--s:1;width:calc(var(--W) * 1px * var(--s) + 28px * var(--s));height:calc(var(--H) * 1px * var(--s) + 28px * var(--s));flex:none}
.phone{width:calc(var(--W) * 1px + 28px);height:calc(var(--H) * 1px + 28px);transform:scale(var(--s));transform-origin:top left;border-radius:68px;padding:14px;background:#1b1f26;box-shadow:0 0 0 2px #3a414c,0 0 0 9px #0d1015,0 40px 90px rgba(0,0,0,.6);position:relative}
.screen{width:100%;height:100%;border-radius:55px;overflow:hidden;background:#0B0F14;position:relative;padding:54px 0 26px;display:flex}
.screen iframe{width:100%;flex:1;border:0;display:block;background:var(--bg)}
.island{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
.home{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);z-index:2;pointer-events:none}
.btns i{position:absolute;background:#2a3039;border-radius:3px;width:5px}
kbd{font-family:inherit;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:6px}
</style>
</head>
<body>
<div class="page">
  <div class="side">
    <h1>Grad<span>Scan</span></h1>
    <p>Anteprima dell'app dentro un iPhone. Scorri con la rotella o trascinando, tocca i pulsanti come sul telefono. I dati che salvi qui restano su questo computer.</p>
    <div class="seg" role="group" aria-label="Modello">
      <button data-m="393,852" aria-pressed="true">iPhone 16</button>
      <button data-m="430,932" aria-pressed="false">16 Pro Max</button>
      <button data-m="375,667" aria-pressed="false">SE</button>
    </div>
    <div class="row">
      <button class="btn primary" id="reload">Ricarica app</button>
      <a class="btn" href="./" target="_blank" rel="noopener">Apri a schermo intero</a>
    </div>
    <p style="font-size:13px">Lo scanner usa la webcam del PC. Per provarlo con una carta vera conviene il telefono.</p>
  </div>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="btns"><i style="left:-7px;top:180px;height:34px"></i><i style="left:-7px;top:240px;height:64px"></i><i style="left:-7px;top:316px;height:64px"></i><i style="right:-7px;top:260px;height:100px"></i></div>
      <div class="screen">
        <div class="island"></div>
        <iframe id="app" src="./" title="GradScan" allow="camera; clipboard-write"></iframe>
        <div class="home"></div>
      </div>
    </div>
  </div>
</div>
<script>
const stage = document.getElementById("stage"), app = document.getElementById("app");
let W = 393, H = 852;
function fit() {
  stage.style.setProperty("--W", W); stage.style.setProperty("--H", H);
  const s = Math.min(1, (innerHeight - 48) / (H + 28), (innerWidth - 32) / (W + 28));
  stage.style.setProperty("--s", Math.max(0.4, s));
}
document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
  [W, H] = b.dataset.m.split(",").map(Number);
  document.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", x === b)); fit();
}));
document.getElementById("reload").addEventListener("click", () => { app.src = "./?t=" + Date.now(); });
addEventListener("resize", fit); fit();
</script>
</body>
</html>
